name: Refresh listing data

# Inside Airbnb publishes new snapshots roughly quarterly. Rebuild the index
# monthly (a no-op commit is skipped when nothing changed) and redeploy.
on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/package-lock.json
      - name: Build index
        working-directory: scripts
        run: |
          npm ci
          npm run build-data
      - name: Commit and redeploy if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data; then
            echo "Data unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Refresh listing data from Inside Airbnb"
          git push
          # Pushes made with GITHUB_TOKEN don't trigger other workflows, so start the deploy explicitly
          gh workflow run pages.yml --ref main
